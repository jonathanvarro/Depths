<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depths · Named companion portrait studies</title>
<style>
  :root { color-scheme: dark; color: #e3d5b8; background: #171916; font: 16px system-ui }
  body { max-width: 70rem; margin: auto; padding: 1rem }
  h1, h2 { font-family: Georgia, serif }
  main { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)) }
  section { background: #22241f; border: 1px solid #605846; padding: 1rem }
  h2 { margin: 0 0 .4rem }
  figure { margin: 0; display: grid; justify-items: center; gap: .5rem }
  img { display: block; background: #181914; image-rendering: pixelated }
  .native { max-width: 100%; height: auto }
  .card { margin-top: .4rem }
  details { margin-top: .8rem }
  summary { cursor: pointer }
  details figure { margin-top: .5rem }
  a { color: #e5be83 }
</style>
<h1>Named companion portrait studies</h1>
<main>
  <section>
    <h2>Branna</h2>
    <p>Mine rescue worker · Melee<br>Approved likeness</p>
    <figure>
      <img class="native" width="192" height="192" src="branna-192.png" alt="Branna with cropped grey hair and a reinforced work coat">
      <img class="card" width="96" height="96" src="branna-96.png" alt="Branna at party-card size">
    </figure>
  </section>
  <section>
    <h2>Nessa</h2>
    <p>Survey assistant · Scout<br>Approved likeness</p>
    <figure>
      <img class="native" width="192" height="192" src="nessa-192.png" alt="Nessa in a waxed cape with a folded survey">
      <img class="card" width="96" height="96" src="nessa-96.png" alt="Nessa at party-card size">
    </figure>
  </section>
  <section>
    <h2>Maelin</h2>
    <p>Unlicensed scholar · Mage<br>Dirty-blonde revision</p>
    <figure>
      <img class="native" width="192" height="192" src="maelin-v3-192.png" alt="Maelin with swept dirty-blonde hair, a raised brow and an uneven plum collar">
      <img class="card" width="96" height="96" src="maelin-v3-96.png" alt="Dirty-blonde Maelin at party-card size">
    </figure>
    <details>
      <summary>Earlier studies</summary>
      <figure>
        <img class="native" width="192" height="192" src="maelin-v2-192.png" alt="Reimagined Maelin with copper hair">
        <img class="card" width="96" height="96" src="maelin-v2-96.png" alt="Copper-haired revision at party-card size">
        <figcaption>Copper-haired revision</figcaption>
      </figure>
      <figure>
        <img class="native" width="192" height="192" src="maelin-192.png" alt="First Maelin study in a high stitched collar">
        <img class="card" width="96" height="96" src="maelin-96.png" alt="First Maelin study at party-card size">
        <figcaption>First likeness</figcaption>
      </figure>
    </details>
  </section>
  <section>
    <h2>Rook</h2>
    <p>Expedition broker · Fixer</p>
    <figure>
      <img class="native" width="192" height="192" src="../../portraits/fixer-v1/fixer-a/preview.png" alt="Existing Fixer portrait proposed for Rook">
      <img class="card" width="96" height="96" src="../../portraits/fixer-v1/fixer-a/preview.png" alt="Proposed Rook reuse at party-card size">
      <figcaption><a href="../fixer-v1/inspector.html">Review the existing Fixer rig</a></figcaption>
    </figure>
  </section>
</main>
</html>
