#depths-pack-heroes .inspect{position:relative;inset:auto;width:100%;max-width:none;min-height:94px;max-height:104px;padding:8px 54px 8px 10px;border-radius:2px;display:grid;grid-template-columns:180px minmax(0,1fr) 170px;grid-template-rows:auto auto;gap:3px 14px;align-items:center;box-shadow:none}
#depths-pack-heroes .inspect-head{grid-column:1;grid-row:1/span 2;padding:0;gap:8px}
#depths-pack-heroes .inspect-head img{width:44px;height:44px}
#depths-pack-heroes .inspect h2{font-size:20px}
#depths-pack-heroes .inspect-type{font-size:15px}
#depths-pack-heroes #depths-inspect-description{grid-column:2;grid-row:1;font-size:17px;max-height:48px;overflow-y:auto}
#depths-pack-heroes .inspect-extra{grid-column:2;grid-row:2;font-size:15px}
#depths-pack-heroes .inspect .primary{grid-column:3;grid-row:1/span 2;font-size:17px;min-height:48px;padding:8px 10px}
#depths-pack-heroes .inspect[data-pinned=false] .primary{display:none}
#depths-pack-heroes .inspect .close{top:5px;right:5px}
#depths-pack-heroes .footer{flex:none;margin-top:6px;min-height:18px;font-size:14px}
#depths-pack-heroes .status-grid{grid-template-columns:1fr;gap:12px;font-size:17px}
#depths-pack-heroes .status-column{gap:12px}
#depths-pack-heroes .status-section{padding-top:6px;gap:5px}
#depths-pack-heroes .status-section h3{font-size:18px}
@media(min-width:1100px) and (max-height:650px){
 #depths-pack-heroes .stage{padding:14px 97px 35px}
 #depths-pack-heroes .window{padding:12px 16px}
 #depths-pack-heroes .equip-board{min-height:162px}
 #depths-pack-heroes .equipment{min-height:162px;padding:28px 18px 24px 26px}
 #depths-pack-heroes .equipment .slot{min-height:76px;max-width:82px}
}
@media(max-width:900px){
 #depths-pack-heroes .stage{padding:12px 18px}
 #depths-pack-heroes .window{padding:12px}
 #depths-pack-heroes .combined{grid-template-columns:minmax(240px,.9fr) minmax(350px,1.1fr);gap:12px}
 #depths-pack-heroes .hero-panel{padding-right:10px}
 #depths-pack-heroes .hero-top{display:block;margin-bottom:2px}
 #depths-pack-heroes .hero-heading{margin-bottom:2px;font-size:16px;line-height:1.1}
 #depths-pack-heroes .hero-heading h2{font-size:19px;line-height:1.1}
 #depths-pack-heroes .hero-toolbar{margin-bottom:0}
 #depths-pack-heroes .equip-board{grid-template-columns:86px minmax(0,1fr);gap:4px;min-height:160px}
 #depths-pack-heroes .hero-picture,#depths-pack-heroes .large-placeholder{width:82px;height:82px}
 #depths-pack-heroes .summary p{font-size:15px}
 #depths-pack-heroes .equipment{min-height:156px;padding:24px 14px 20px 22px;gap:7px}
 #depths-pack-heroes .equipment .slot{min-height:64px}
 #depths-pack-heroes .equip-cell>span{font-size:16px}
 #depths-pack-heroes .physical-bag{width:100%}
 #depths-pack-heroes .bag-heading{align-items:start}
 #depths-pack-heroes .bag-heading h2{font-size:19px}
 #depths-pack-heroes .lantern{font-size:14px}
 #depths-pack-heroes .oil-track{width:100px}
 #depths-pack-heroes .bag .slot .qty{font-size:13px}
 #depths-pack-heroes .sample-note{display:none}
 #depths-pack-heroes .inspection-dock{height:118px}
 #depths-pack-heroes .inspect{grid-template-columns:130px minmax(0,1fr) 128px;gap:3px 8px;max-height:118px;min-height:108px}
 #depths-pack-heroes .inspect h2{font-size:18px}
 #depths-pack-heroes .inspect-head{gap:4px}
 #depths-pack-heroes .inspect-head img{width:36px;height:36px}
 #depths-pack-heroes #depths-inspect-description{font-size:16px;max-height:64px}
 #depths-pack-heroes .inspect-extra{font-size:14px}
 #depths-pack-heroes .inspect .primary{font-size:16px}
}
</style>
 <div class="stage">
  <div class="launcher" hidden><button data-open="equipment">Open Equipment &amp; Pack</button></div>
  <section class="window" aria-label="Equipment and shared pack">
   <header class="top"><h1 class="page-title">Equipment &amp; Pack</h1><button class="back">Back</button></header>
   <div class="combined">
    <section class="hero-panel" aria-label="Selected hero">
     <div class="hero-top"><div class="hero-heading"><h2 class="hero-name">Mara</h2><span class="hero-role muted">Rogue</span></div>
     <div class="hero-toolbar"><div class="tabs" role="tablist" aria-label="Hero details">
      <button id="depths-equipment-tab" role="tab" aria-selected="true" aria-controls="depths-equipment">Equipment</button>
      <button id="depths-status-tab" role="tab" aria-selected="false" aria-controls="depths-status">Status</button>
     </div></div></div>
     <div class="hero-body">
      <section id="depths-equipment" role="tabpanel" aria-labelledby="depths-equipment-tab"><div class="equip-board"><div class="summary"></div><div class="equipment" aria-label="Equipped items"></div></div></section>
      <section id="depths-status" role="tabpanel" aria-labelledby="depths-status-tab" hidden></section>
     </div>
     <nav class="party" aria-label="Choose hero"></nav>
    </section>
    <section class="pack-page" aria-label="Shared backpack">
     <div class="bag-heading"><h2>Shared pack</h2><div class="lantern"><strong class="number">Lantern · 62 / 100</strong><div class="oil-track"><div class="oil-fill"></div></div></div></div>
     <div class="bag-wrap"><div class="physical-bag"><div class="bag" aria-label="Inventory slots"></div></div></div>
    </section>
   </div>
   <div class="inspection-dock" aria-label="Item inspection">
    <p class="inspect-hint muted">Select an item to inspect it. Select a portrait to change hero.</p>
    <section class="inspect" role="dialog" aria-modal="false" aria-labelledby="depths-inspect-title" data-pinned="false" hidden>
     <button class="close" aria-label="Close item details">×</button>
     <div class="inspect-head"><img alt=""><div><h2 id="depths-inspect-title"></h2><p class="inspect-type muted small"></p></div></div>
     <p id="depths-inspect-description"></p><p class="inspect-extra muted small"></p><button class="primary"></button>
    </section>
   </div>
   <p class="footer" role="status" aria-live="polite">Visual study · Sample inventory · Browsing costs no time.</p>
   <div class="gear-bag" hidden><div class="spares"></div></div>
  </section>
 </div>
</div>
<script>
(()=>{
  const root=document.getElementById('depths-pack-heroes');
  const $=s=>root.querySelector(s), $$=s=>[...root.querySelectorAll(s)];
  const art={mara:'../../../portraits/mara-neutral-v1/preview.png',knife:'../pack-heroes-v2/assets/knife.png',club:'../pack-heroes-v2/assets/club.png',spear:'../pack-heroes-v2/assets/spear.png',staff:'../pack-heroes-v2/assets/staff.png',shield:'../pack-heroes-v2/assets/shield.png',coat:'../pack-heroes-v2/assets/coat.png',oil:'../pack-heroes-v2/assets/oil.png',ration:'../pack-heroes-v2/assets/ration.png',draught:'../pack-heroes-v2/assets/draught.png',dressing:'../pack-heroes-v2/assets/dressing.png'};
  const items={
    oil:{name:'Oil flask',type:'Shared supply',desc:'Refills the lantern. Any unused oil stays in the flask.',extra:'For the lantern',verb:'Refill lantern · 2 time'},
    ration:{name:'Ration',type:'Shared supply',desc:'Each living hero regains 4 health over 20 time. Also feeds the party.',extra:'Recovery finishes at rest or when changing floors.',verb:'Eat ration · 1 time'},
    draught:{name:'Restorative draught',type:'Shared supply',desc:'The most hurt hero regains 10 health over 20 time.',extra:'Recovery finishes at rest or when changing floors.',verb:'Drink draught · 1 time'},
    dressing:{name:'Clean dressing',type:'Shared supply',desc:'Binds one injury until camp. Stops its penalty; it does not heal the injury.',extra:'No injury needs binding in this sample.',verb:'No injury to bind'},
    knife:{name:'Plain knife',type:'Weapon',slot:'main',desc:'A rough iron blade with a worn wooden grip. Light rust marks the edge.'},
    club:{name:'Wooden club',type:'Main hand',slot:'main',desc:'A heavy knot of wood with a simple wrapped grip.'},
    spear:{name:'Simple spear',type:'Main hand',slot:'main',desc:'A plain wooden shaft tipped with a small iron point.'},
    staff:{name:'Plain staff',type:'Main hand',slot:'main',desc:'A worn length of wood with a cloth grip. Nothing ornate.'},
    shield:{name:'Wooden shield',type:'Off hand',slot:'off',desc:'Rough wooden planks, an iron boss, and a battered rim.'},
    coat:{name:'Padded coat',type:'Body',slot:'body',desc:'A plain quilted coat, tied at the front. Practical protection.'}
  };
  const gear=['knife','club','spear','staff','coat'], supply=['oil','ration','draught','dressing'];
  const roles=[['main','Weapon'],['body','Body']];
  const defaults=()=>({page:'equipment',hero:0,open:true,counts:{oil:3,ration:2,draught:1,dressing:2},loadouts:[{main:'knife',body:'coat'},{},{ }],feedback:'Visual study · Sample inventory · Browsing costs no time.'});
  let state=defaults(), active=null, hideTimer=0, suppressFocus=false, suppressHover=false, opener=null;
  const heroes=[{name:'Mara',role:'Rogue',portrait:art.mara},{name:'Hero II',role:'Example companion',initial:'II'},{name:'Hero III',role:'Example companion',initial:'III'}];
  const settings={party:'Full party example'};
  function restore(saved){
    const p=saved?.privateContent;
    if(!p||p.version!==4)return;
    if(['equipment','status'].includes(p.page))state.page=p.page;
    if(Number.isInteger(p.hero)&&p.hero>=0&&p.hero<3)state.hero=p.hero;
    if(typeof p.open==='boolean')state.open=p.open;
    if(p.counts&&supply.every(k=>Number.isInteger(p.counts[k])&&p.counts[k]>=0&&p.counts[k]<=9))state.counts={...p.counts};
    if(Array.isArray(p.loadouts)&&p.loadouts.length===3){
      const seen=new Set();
      state.loadouts=p.loadouts.map(o=>Object.fromEntries(Object.entries(o||{}).filter(([s,k])=>{if(items[k]?.slot!==s||seen.has(k))return false;seen.add(k);return true;})));
    }
  }
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Combined equipment left / shared backpack right',page:state.page,hero:heroes[state.hero].name},privateContent:{version:4,...state}}).catch(()=>{});}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{closeDetail(false);restore(e.detail?.globals?.widgetState);render();});
  function inPack(k){return !state.loadouts.some(o=>Object.values(o).includes(k));}
  function slot(k,context,label){
    const b=document.createElement('button');b.type='button';b.className='slot cursor-interaction'+(!k?' empty':'');
    if(!k){b.disabled=true;b.setAttribute('aria-label',label||'Empty inventory slot');b.innerHTML='<span class="empty-mark" aria-hidden="true">·</span>';return b;}
    b.dataset.item=k;b.dataset.context=context;b.setAttribute('aria-label',items[k].name+(supply.includes(k)?`, ${state.counts[k]} left`:''));b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-expanded','false');
    const image=document.createElement('img');image.src=art[k];image.alt='';b.append(image);
    if(supply.includes(k)){const n=document.createElement('span');n.className='qty number';n.textContent='×'+state.counts[k];b.append(n);}
    b.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'&&!active?.pinned&&!suppressHover)showDetail(b,false);});
    b.addEventListener('pointerleave',()=>{if(!active?.pinned)hideTimer=setTimeout(()=>{if(!active?.pinned)closeDetail(false);},160);});
    b.addEventListener('focus',()=>{if(!suppressFocus&&!active?.pinned)showDetail(b,false);});
    b.addEventListener('click',()=>{showDetail(b,true);$('.inspect .primary').disabled?$('.inspect .close').focus():$('.inspect .primary').focus();});
    return b;
  }
  function render(){
    $('.window').hidden=!state.open;$('.launcher').hidden=state.open;
    $('.page-title').textContent='Equipment & Pack';

    const nav=$('.party');nav.replaceChildren();heroes.forEach((h,i)=>{
      const b=document.createElement('button');b.type='button';b.className='portrait-button cursor-interaction';b.dataset.hero=i;b.setAttribute('aria-label','Inspect '+h.name);b.setAttribute('aria-pressed',String(state.hero===i));
      b.hidden=settings.party==='Mara only'&&i>0;
      b.innerHTML=h.portrait?`<img src="${h.portrait}" alt=""><span>${h.name}</span>`:`<span class="portrait-placeholder" aria-hidden="true"><i>${h.initial}</i></span><span>${h.name}</span>`;
      b.addEventListener('click',()=>{closeDetail(false);state.hero=i;if(state.page==='pack')state.page='equipment';state.feedback='Visual study · Sample inventory · Browsing costs no time.';render();$(`[data-hero="${i}"]`).focus();remember();});nav.append(b);
    });
    const note=document.createElement('span');note.className='sample-note';note.textContent='Example party';note.hidden=settings.party==='Mara only';nav.append(note);
    const h=heroes[state.hero];$('.hero-name').textContent=h.name;$('.hero-role').textContent=h.role;
    $('.hero-toolbar').hidden=false;$('.hero-heading').hidden=false;$('.tabs').hidden=false;
    $('#depths-equipment').hidden=state.page!=='equipment';$('#depths-status').hidden=state.page!=='status';$('.pack-page').hidden=false;
    $('#depths-equipment-tab').setAttribute('aria-selected',String(state.page==='equipment'));$('#depths-status-tab').setAttribute('aria-selected',String(state.page==='status'));
    $('.summary').innerHTML=(h.portrait?`<img class="hero-picture" alt="Mara" src="${h.portrait}">`:`<div class="large-placeholder" aria-hidden="true">${h.initial}</div>`)+(state.hero===0?'<p class="small number">Health 14 / 20</p><p class="muted small">Shaken</p>':'<p class="small muted">Example companion</p>');
    const grid=$('.equipment');grid.replaceChildren();roles.forEach(([id,name])=>{const c=document.createElement('div');c.className='equip-cell';c.dataset.role=id;const label=document.createElement('span');label.textContent=name;c.append(label,slot(state.loadouts[state.hero][id],'equipped','Empty '+name));grid.append(c);});
    const spares=$('.spares');spares.replaceChildren();gear.filter(inPack).forEach(k=>spares.append(slot(k,'bag')));
    const bag=$('.bag');bag.replaceChildren();[...supply,...gear.filter(inPack)].forEach(k=>bag.append(slot(k,'bag')));while(bag.children.length<12)bag.append(slot(null,'bag'));
    $('#depths-status').innerHTML=state.hero===0?`<div class="status-grid"><div class="status-column"><section class="status-section"><h3>Condition</h3><div class="meter-label"><span>Health</span><span class="number">14 / 20</span></div><div class="meter" role="meter" aria-label="Health" aria-valuenow="14" aria-valuemin="0" aria-valuemax="20"><span style="width:70%"></span></div><div class="meter-label"><span>Strain · Shaken</span><span class="number">55 / 100</span></div><div class="meter strain" role="meter" aria-label="Strain" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100"><span style="width:55%"></span></div><p class="small muted">Fed · No lasting injuries</p></section><section class="status-section"><h3>Trait</h3><p>Keen eyes</p><p class="small muted">Traps show before you step on them.</p></section></div><div class="status-column"><section class="status-section"><h3>Personality</h3><p>Weathered, practical, quiet under pressure.</p></section><section class="status-section"><h3>Burden</h3><p>Guilt over the companions she lost.</p></section><section class="status-section"><h3>Reason to go on</h3><p>She led them into the cave. Now she has to get out and live with it.</p></section></div></div>`:'<div class="status-grid"><section class="status-section"><h3>Condition</h3><dl><dt>Health</dt><dd>—</dd><dt>Strain</dt><dd>—</dd><dt>Injuries</dt><dd>—</dd></dl></section><section class="status-section"><h3>Character</h3><p class="muted">Example companion</p><p class="small muted">The same window will show this hero’s condition and personality.</p></section></div>';
    $('.footer').textContent=state.feedback;
  }
  function closeDetail(restoreFocus=true){
    clearTimeout(hideTimer);const previous=active?.trigger;if(previous)previous.setAttribute('aria-expanded','false');active=null;$('.inspect').hidden=true;$('.inspect-hint').hidden=false;$$('.equip-cell').forEach(c=>c.classList.remove('receives'));suppressHover=true;
    if(restoreFocus&&previous?.isConnected){suppressFocus=true;previous.focus({preventScroll:true});requestAnimationFrame(()=>suppressFocus=false);}
  }
  function placeDetail(){} // Details occupy their own reserved bottom row.
  function showDetail(trigger,pinned){
    clearTimeout(hideTimer);if(active?.trigger!==trigger)closeDetail(false);const k=trigger.dataset.item,i=items[k];
    active={key:k,context:trigger.dataset.context,trigger,pinned};trigger.setAttribute('aria-expanded','true');
    $('.inspect-head img').src=art[k];$('#depths-inspect-title').textContent=i.name;$('.inspect-type').textContent=i.type;
    $('#depths-inspect-description').textContent=i.desc;
    const current=state.loadouts[state.hero][i.slot];
    $('.inspect-extra').textContent=i.extra||(active.context==='equipped'?'Equipped by '+heroes[state.hero].name:'For '+heroes[state.hero].name+(current?' · Replaces '+items[current].name:' · Empty slot'));
    $('.inspect-hint').hidden=true;$$('.equip-cell').forEach(c=>c.classList.toggle('receives',active.context==='bag'&&c.dataset.role===i.slot));
    const b=$('.inspect .primary');b.disabled=k==='dressing'||(supply.includes(k)&&state.counts[k]===0);
    b.textContent=supply.includes(k)?(state.counts[k]===0?'None left':i.verb):(active.context==='equipped'?'Unequip':'Equip for '+heroes[state.hero].name);
    $('.inspect').dataset.pinned=String(pinned);$('.inspect').hidden=false;placeDetail();
  }
  $('.inspect').addEventListener('pointerenter',()=>clearTimeout(hideTimer));$('.inspect').addEventListener('pointerleave',()=>{if(!active?.pinned)hideTimer=setTimeout(()=>{if(!active?.pinned)closeDetail(false);},160);});
  $('.inspect .close').addEventListener('click',()=>closeDetail());
  $('.inspect .primary').addEventListener('click',()=>{
    if(!active||$('.inspect .primary').disabled)return;
    const {key:k,context}=active,i=items[k];
    if(supply.includes(k)){state.counts[k]--;state.feedback=k==='ration'?'You eat. Strength returns slowly.':k==='draught'?'The draught takes hold slowly.':'You refill the lantern.';}
    else{if(context==='equipped'){delete state.loadouts[state.hero][i.slot];state.feedback=i.name+' returned to the shared pack.';}else{state.loadouts[state.hero][i.slot]=k;state.page='equipment';state.feedback=i.name+' equipped by '+heroes[state.hero].name+'.';}}
    closeDetail(false);render();const destination=$(`[data-item="${k}"]`);suppressFocus=true;(destination||$('.back')).focus({preventScroll:true});requestAnimationFrame(()=>suppressFocus=false);remember();
  });
  function changePage(page){closeDetail(false);state.page=page;state.feedback='Visual study · Sample inventory · Browsing costs no time.';render();remember();}
  $('#depths-equipment-tab').addEventListener('click',()=>changePage('equipment'));$('#depths-status-tab').addEventListener('click',()=>changePage('status'));
  $('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const page=e.target.id==='depths-status-tab'?'equipment':'status';changePage(page);$(page==='status'?'#depths-status-tab':'#depths-equipment-tab').focus();}});

  function closeWindow(){closeDetail(false);state.open=false;render();(opener||$('[data-open="equipment"]')).focus();remember();}
  $('.back').addEventListener('click',closeWindow);
  $$('[data-open]').forEach(b=>b.addEventListener('click',()=>{opener=b;state.open=true;state.page='equipment';state.feedback='Visual study · Sample inventory · Browsing costs no time.';render();$('.back').focus();remember();}));
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();active?closeDetail():state.open&&closeWindow();}});
  root.addEventListener('pointerdown',e=>{if(active&&!$('.inspect').contains(e.target)&&!active.trigger.contains(e.target))closeDetail(false);});
  root.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&(e.movementX||e.movementY)){suppressHover=false;const b=e.target.closest('.slot[data-item]');if(b&&!active?.pinned&&active?.trigger!==b)showDetail(b,false);}});
  new ResizeObserver(placeDetail).observe(root);
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{if(settings.party==='Mara only')state.hero=0;closeDetail(false);render();}});tweak.addSelect(settings,'party',{label:'Party preview',options:['Full party example','Mara only']});}
})();
</script>
