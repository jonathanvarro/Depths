    #depths-pack-heroes{--d-bg:#111610;--d-panel:#22231d;--d-inset:#191d17;--d-text:#e6dac1;--d-muted:#b7ab93;--d-edge:#66543c;--d-gold:#d7b174;--d-selected:#51432d;color-scheme:dark;color:var(--d-text);font:20px/1.35 DepthsBody,sans-serif;position:relative}

    #depths-pack-heroes .window{background:var(--d-panel);border:1px solid var(--d-edge);padding:16px;position:relative}
    #depths-pack-heroes .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
    #depths-pack-heroes .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    #depths-pack-heroes .workspace{display:grid;grid-template-columns:96px minmax(0,1fr);gap:24px}
    #depths-pack-heroes .party{display:flex;flex-direction:column;gap:12px;border-right:1px solid #454735;padding-right:14px}
    #depths-pack-heroes .portrait-button{padding:4px;width:80px;display:flex;flex-direction:column;align-items:center;gap:4px}
    #depths-pack-heroes .portrait-button img{width:68px;height:68px;image-rendering:pixelated;object-fit:cover}
    #depths-pack-heroes .portrait-button span{font-size:15px}
    #depths-pack-heroes .portrait-placeholder{height:68px;width:68px;display:grid;place-items:center;background:#171c17;color:#b7ab93}
    #depths-pack-heroes .portrait-placeholder i{font:600 30px DepthsHeading,serif;font-style:normal}
    #depths-pack-heroes .hero-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
    #depths-pack-heroes .hero-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    #depths-pack-heroes .hero-toolbar .hero-heading{margin:0;justify-content:flex-start}
    #depths-pack-heroes .hero-toolbar .tabs{margin:0;padding:0;border:0}
    #depths-pack-heroes .tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid #454735;padding-bottom:6px}
    #depths-pack-heroes .tabs button{border-color:transparent;background:transparent;min-width:112px;min-height:44px}
    #depths-pack-heroes .tabs button[aria-selected=true]{border-color:var(--d-gold);background:var(--d-selected)}
    #depths-pack-heroes .equip-board{display:grid;grid-template-columns:166px minmax(0,1fr);gap:22px;align-items:start}
    #depths-pack-heroes .hero-picture{width:160px;height:160px;object-fit:cover;image-rendering:pixelated;border:1px solid var(--d-edge);background:var(--d-inset)}
    #depths-pack-heroes .large-placeholder{width:160px;height:160px;display:grid;place-items:center;background:var(--d-inset);border:1px solid var(--d-edge);font:600 44px DepthsHeading,serif}
    #depths-pack-heroes .summary{display:grid;gap:6px}
    #depths-pack-heroes .equipment{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:300px}
    #depths-pack-heroes .equip-cell{display:grid;gap:4px;justify-items:center;min-width:0}
    #depths-pack-heroes .equip-cell>span{font-size:16px;color:var(--d-muted);text-align:center}
    #depths-pack-heroes .slot{width:100%;aspect-ratio:1;min-height:64px;padding:4px;position:relative;display:grid;place-items:center;background:#191d17;border:1px solid #5c503d}
    #depths-pack-heroes .slot img{width:76%;height:76%;object-fit:contain;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 2px 1px #080b08)}
    #depths-pack-heroes .slot .qty{position:absolute;bottom:4px;right:7px;font-size:16px;color:var(--d-gold);background:#191d17;padding:0 3px}
    #depths-pack-heroes .slot.empty{border-color:#3f4234;background:#1d2019;color:#666953}
    #depths-pack-heroes .slot.empty:disabled{background:#1d2019;border-color:#3f4234}
    #depths-pack-heroes .slot .empty-mark{font-size:23px;color:#7f7c67;font-weight:400}
    #depths-pack-heroes .gear-bag{margin-top:12px;border-top:1px solid #454735;padding-top:8px}
    #depths-pack-heroes .gear-bag h3{font:400 17px DepthsBody,sans-serif;color:var(--d-muted);margin-bottom:6px}
    #depths-pack-heroes .spares{display:grid;grid-template-columns:repeat(8,minmax(0,56px));gap:8px}
    #depths-pack-heroes .spares .slot{min-height:54px;max-width:76px}
    #depths-pack-heroes .lantern{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
    #depths-pack-heroes .lantern strong{color:var(--d-gold);font-weight:600}
    #depths-pack-heroes .oil-track{height:5px;width:180px;background:#121a15;margin-top:7px}
    #depths-pack-heroes .oil-fill{width:62%;height:100%;background:var(--d-gold)}
    #depths-pack-heroes .bag-wrap{display:grid;justify-items:center}
    #depths-pack-heroes .bag{width:100%;max-width:440px;padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:#1b1e17;border:1px solid #5b4a34;box-shadow:inset 0 0 0 5px #20231b}
    #depths-pack-heroes .bag .slot{min-height:64px}
    #depths-pack-heroes .bag .slot img{width:70%;height:70%}
    #depths-pack-heroes .footer{font-size:16px;color:var(--d-muted);margin-top:10px;min-height:20px}
    #depths-pack-heroes .status-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
    #depths-pack-heroes .status-column{display:grid;align-content:start;gap:16px}
    #depths-pack-heroes .status-section{border-top:1px solid #454735;padding-top:10px;display:grid;gap:7px}
    #depths-pack-heroes .status-section h3{margin-bottom:2px}
    #depths-pack-heroes .meter-label{display:flex;justify-content:space-between;gap:12px}
    #depths-pack-heroes .meter{height:7px;background:#121a15}
    #depths-pack-heroes .meter span{height:100%;display:block;background:#ad6756}
    #depths-pack-heroes .meter.strain span{background:var(--d-gold)}
    #depths-pack-heroes dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 14px}#depths-pack-heroes dd{margin:0;color:var(--d-text)}#depths-pack-heroes dt{color:var(--d-muted)}
    #depths-pack-heroes .inspect{position:absolute;z-index:30;width:320px;max-width:calc(100% - 24px);background:#282b21;border:1px solid var(--d-gold);box-shadow:0 10px 32px #000b;padding:16px;display:grid;gap:10px}
    #depths-pack-heroes .inspect-head{display:flex;gap:12px;align-items:center;padding-right:38px}
    #depths-pack-heroes .inspect-head img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
    #depths-pack-heroes .inspect .close{position:absolute;right:5px;top:5px;min-width:44px;min-height:44px;padding:4px;background:transparent;border-color:transparent}
    #depths-pack-heroes .inspect h2{font-size:22px;overflow-wrap:anywhere}
    #depths-pack-heroes .inspect .primary{background:var(--d-gold);border-color:var(--d-gold);color:#201f18;width:100%}
    #depths-pack-heroes .inspect .primary:focus-visible{outline-color:var(--d-text)}
    #depths-pack-heroes .inspect .primary:disabled{background:#303027;border-color:#66543c;color:#aaa18d}
    #depths-pack-heroes .inspect[data-pinned=false]{pointer-events:none}
    #depths-pack-heroes .inspect[data-pinned=false] .primary,#depths-pack-heroes .inspect[data-pinned=false] .close{display:none}
    #depths-pack-heroes .launcher{min-height:510px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;align-content:center}
    #depths-pack-heroes .sample-note{font-size:14px;color:var(--d-muted)}
    @media(min-width:1100px) and (max-height:650px){#depths-pack-heroes .stage{padding:14px 97px 35px;min-height:0}#depths-pack-heroes .top{margin-bottom:10px}#depths-pack-heroes .footer{margin-top:8px}}
    @media(max-width:800px){#depths-pack-heroes{font-size:18px}#depths-pack-heroes .stage{padding:12px}#depths-pack-heroes .window{padding:16px}#depths-pack-heroes .workspace{gap:16px;grid-template-columns:82px minmax(0,1fr)}#depths-pack-heroes .party{padding-right:8px}#depths-pack-heroes .portrait-button{width:72px}#depths-pack-heroes .portrait-button img,#depths-pack-heroes .portrait-placeholder{width:60px;height:60px}#depths-pack-heroes .equip-board{grid-template-columns:128px minmax(0,1fr);gap:16px}#depths-pack-heroes .hero-picture,#depths-pack-heroes .large-placeholder{width:124px;height:124px}#depths-pack-heroes .equipment{gap:10px}#depths-pack-heroes .spares{grid-template-columns:repeat(6,minmax(0,1fr))}#depths-pack-heroes .spares .slot{max-width:72px}}
    @media(max-width:620px){#depths-pack-heroes .workspace{grid-template-columns:1fr}#depths-pack-heroes .party{flex-direction:row;border-right:0;border-bottom:1px solid #454735;padding:0 0 10px;gap:10px;align-items:center}#depths-pack-heroes .portrait-button{min-width:68px}#depths-pack-heroes .sample-note{max-width:100px}#depths-pack-heroes .spares{grid-template-columns:repeat(6,minmax(0,1fr))}#depths-pack-heroes .top{margin-bottom:12px}#depths-pack-heroes .stage{min-height:0}#depths-pack-heroes .inspect{font-size:18px}}
    @media(max-width:430px){#depths-pack-heroes .stage{padding:6px}#depths-pack-heroes .window{padding:12px}#depths-pack-heroes h1{font-size:27px}#depths-pack-heroes .top{gap:8px}#depths-pack-heroes .top .controls{gap:6px}#depths-pack-heroes button{padding:8px 12px;font-size:18px}#depths-pack-heroes .equip-board{grid-template-columns:1fr}#depths-pack-heroes .summary{display:none}#depths-pack-heroes .equipment{gap:10px}#depths-pack-heroes .spares{grid-template-columns:repeat(4,minmax(0,1fr))}#depths-pack-heroes .status-grid{grid-template-columns:1fr;gap:16px}#depths-pack-heroes .bag{padding:10px;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}#depths-pack-heroes .sample-note{font-size:13px;max-width:58px}#depths-pack-heroes .portrait-button{width:64px;min-width:64px}#depths-pack-heroes .portrait-button img,#depths-pack-heroes .portrait-placeholder{width:52px;height:52px}#depths-pack-heroes .party{gap:6px}#depths-pack-heroes .slot{min-height:58px}#depths-pack-heroes .inspect{padding:12px}}
  </style>

    $('#depths-equipment').hidden=state.page!=='equipment';$('#depths-status').hidden=state.page!=='status';$('.pack-page').hidden=state.page!=='pack';

    const spares=$('.spares');spares.replaceChildren();gear.filter(inPack).forEach(k=>spares.append(slot(k,'bag')));
